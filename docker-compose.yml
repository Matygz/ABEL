# Servicios de ABEL.
#
# PostgreSQL guarda la memoria estructurada; Qdrant los vectores para
# búsqueda por similitud. Los dos exponen su puerto solo en localhost:
# ABEL no acepta conexiones de la red (ver decisión 0032).
#
#   docker compose up -d      levantar
#   docker compose down       detener
#   docker compose logs -f    ver registro

services:
  postgres:
    image: postgres:18-alpine
    container_name: abel-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: abel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ABEL_DB_ROOT_PASSWORD}
      # Collation es-AR con ICU, igual que la instalación nativa.
      POSTGRES_INITDB_ARGS: >-
        --encoding=UTF8
        --locale-provider=icu
        --icu-locale=es-AR
        --locale=C
    volumes:
      - abel-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d abel"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: abel-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - abel-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s

volumes:
  abel-postgres:
  abel-qdrant: