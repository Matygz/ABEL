<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABEL</title>
<style>
  :root {
    --vacio: #05070a;
    --tenue: #4a5560;
    --texto: #b8c4d0;
    --frio: #4fd1e0;
    --calido: #e8b04f;
    --alerta: #e05f5f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%; overflow: hidden;
    background: var(--vacio); color: var(--texto);
    font: 13px/1.7 ui-monospace, "Cascadia Code", Consolas, monospace;
    letter-spacing: .02em;
  }

  #escena { position: fixed; inset: 0; opacity: 0; transition: opacity 1.2s; }
  #escena.visible { opacity: 1; }

  /* --- Marcas mínimas en las esquinas ------------------------------ */

  .marca {
    position: fixed; font-size: 10px; letter-spacing: .2em;
    color: var(--tenue); text-transform: uppercase;
    pointer-events: none; user-select: none;
    transition: opacity .8s;
  }
  #identidad { top: 1.75rem; left: 2rem; }
  #pulso-info { bottom: 1.75rem; left: 2rem; }
  #hora { bottom: 1.75rem; right: 2rem; }

  /* --- Invocador --------------------------------------------------- */

  #invocador {
    position: fixed; top: 1.5rem; right: 2rem;
    display: flex; gap: .6rem;
    opacity: .25; transition: opacity .5s;
  }
  #invocador:hover { opacity: 1; }

  #invocador button {
    background: none; border: 1px solid var(--tenue);
    color: var(--tenue); font: inherit; font-size: 10px;
    letter-spacing: .15em; text-transform: uppercase;
    padding: .4rem .9rem; border-radius: 2px; cursor: pointer;
    transition: all .25s;
  }
  #invocador button:hover {
    border-color: var(--frio); color: var(--frio);
  }

  /* --- Paneles emergentes ------------------------------------------ */

  #paneles {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: rgba(5, 7, 10, .55);
    backdrop-filter: blur(3px);
  }
  #paneles.visible { display: flex; }

  .panel {
    width: min(38rem, 90vw); max-height: 78vh;
    background: rgba(9, 12, 17, .94);
    border: 1px solid rgba(74, 85, 96, .35);
    border-radius: 3px; padding: 1.75rem 2rem;
    overflow-y: auto;
    animation: emerger .3s cubic-bezier(.16,1,.3,1);
  }
  @keyframes emerger {
    from { opacity: 0; transform: translateY(8px) scale(.99); }
  }

  .panel h2 {
    font-size: 10px; font-weight: 400; letter-spacing: .25em;
    text-transform: uppercase; color: var(--tenue);
    margin-bottom: 1.5rem;
    display: flex; justify-content: space-between;
  }
  .panel h2 button {
    background: none; border: none; color: var(--tenue);
    font: inherit; cursor: pointer; letter-spacing: .1em;
  }
  .panel h2 button:hover { color: var(--texto); }

  .fila {
    display: flex; justify-content: space-between; gap: 1.5rem;
    padding: .5rem 0;
    border-bottom: 1px solid rgba(74, 85, 96, .12);
  }
  .fila:last-child { border-bottom: none; }
  .fila .dato { color: var(--tenue); white-space: nowrap; font-size: 12px; }
  .fila .titulo {
    color: var(--tenue); font-size: 11px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .vacio-mensaje {
    color: var(--tenue); font-size: 12px; padding: 1rem 0;
  }

  /* --- Estado (sangre) ---------------------------------------------- */

  .valor-sangre { padding: .6rem 0; border-bottom: 1px solid rgba(74, 85, 96, .12); }
  .valor-sangre:last-child { border-bottom: none; }
  .valor-sangre.inactivo { opacity: .4; }

  .valor-sangre .cabecera {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: .4rem;
  }
  .valor-sangre .nombre {
    color: var(--texto); font-size: 12px; letter-spacing: .05em;
  }
  .valor-sangre .cifras {
    display: flex; align-items: baseline; gap: .5rem;
    color: var(--tenue); font-size: 11px;
  }
  .valor-sangre .tendencia { width: 1em; text-align: center; }
  .valor-sangre .tendencia.sube { color: var(--frio); }
  .valor-sangre .tendencia.baja { color: var(--calido); }

  .valor-sangre .barra {
    position: relative; height: 4px; border-radius: 2px;
    background: rgba(74, 85, 96, .25); overflow: visible;
  }
  .valor-sangre .relleno {
    position: absolute; inset: 0 auto 0 0; height: 100%;
    width: 0%; border-radius: 2px;
    background: var(--frio);
    transition: width .4s ease;
  }
  /* La marca de reposo: una línea fina sobre la barra, para ver hacia
     dónde vuelve el valor cuando nadie lo empuja. */
  .valor-sangre .reposo {
    position: absolute; top: -2px; width: 1px; height: 8px;
    background: var(--tenue);
  }

  .subtitulo-sangre {
    color: var(--tenue); font-size: 10px; letter-spacing: .15em;
    text-transform: uppercase; opacity: .5;
    margin: 1rem 0 .5rem;
  }

  #invocar-chat {
    position: fixed; bottom: 1.75rem; left: 50%;
    transform: translateX(-50%);
    background: none; border: 1px solid var(--tenue);
    color: var(--tenue); font: inherit; font-size: 10px;
    letter-spacing: .2em; text-transform: uppercase;
    padding: .5rem 1.4rem; border-radius: 2px; cursor: pointer;
    opacity: .3; transition: all .35s;
  }
  #invocar-chat:hover { opacity: 1; border-color: var(--frio); color: var(--frio); }
  #invocar-chat.oculto { opacity: 0; pointer-events: none; }
  /* --- Rastro de eventos ------------------------------------------- */

  #rastro {
    position: fixed; top: 50%; right: 2rem;
    transform: translateY(-50%);
    text-align: right; pointer-events: none;
    font-size: 10px; letter-spacing: .1em;
  }
  #rastro div {
    color: var(--tenue); opacity: 0;
    animation: aparecer 6s forwards;
  }
  @keyframes aparecer {
    10% { opacity: .8; }
    70% { opacity: .25; }
    100% { opacity: 0; }
  }

  /* --- Entrada ------------------------------------------------------ */

  #entrada {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2rem;
  }
  #entrada.oculto { display: none; }
  #entrada p {
    color: var(--tenue); font-size: 11px; letter-spacing: .15em;
    text-align: center; max-width: 24rem; line-height: 2;
  }
  #entrada button {
    background: none; border: 1px solid var(--frio); color: var(--frio);
    font: inherit; font-size: 11px; letter-spacing: .25em;
    text-transform: uppercase; padding: .7rem 2.5rem;
    border-radius: 2px; cursor: pointer; transition: all .3s;
  }
  #entrada button:hover {
    background: rgba(79, 209, 224, .08);
  }
  #error { color: var(--alerta); font-size: 11px; min-height: 1.5em; }
  #secciones {
    display: flex; gap: 1.5rem; margin-bottom: 1.5rem;
    padding-bottom: .75rem;
    border-bottom: 1px solid rgba(74, 85, 96, .2);
  }
  #secciones button {
    background: none; border: none; color: var(--tenue);
    font: inherit; font-size: 10px; letter-spacing: .15em;
    text-transform: uppercase; cursor: pointer; padding: 0;
    transition: color .2s;
  }
  #secciones button:hover { color: var(--texto); }
  #secciones button.activa { color: var(--frio); }

  /* --- Conversación ------------------------------------------------ */

  #chat {
    position: fixed; bottom: 0; left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: min(42rem, 92vw);
    margin-bottom: 1.5rem;
    padding: 1.25rem 1.5rem;
    background: rgba(9, 12, 17, .92);
    border: 1px solid rgba(74, 85, 96, .3);
    border-radius: 4px;
    backdrop-filter: blur(6px);
    display: flex; flex-direction: column; gap: .9rem;
    opacity: 0; pointer-events: none;
    transition: transform .45s cubic-bezier(.16,1,.3,1), opacity .35s;
  }
  #chat.abierto {
    transform: translateX(-50%) translateY(0);
    opacity: 1; pointer-events: auto;
  }

  #conversacion {
    display: flex; flex-direction: column; gap: .6rem;
    max-height: 40vh; overflow-y: auto;
    scrollbar-width: none;
    padding-top: 3rem;
    /* Los mensajes se desvanecen hacia arriba. Vuelven al hacer scroll:
       la máscara es fija respecto del contenedor, no del contenido. */
    mask-image: linear-gradient(
      to bottom,
      transparent 0,
      rgba(0, 0, 0, .15) 2rem,
      rgba(0, 0, 0, .6) 3.5rem,
      #000 5rem
    );
    -webkit-mask-image: linear-gradient(
      to bottom,
      transparent 0,
      rgba(0, 0, 0, .15) 2rem,
      rgba(0, 0, 0, .6) 3.5rem,
      #000 5rem
    );
  }
  #conversacion::-webkit-scrollbar { display: none; }

 .dicho {
    font-size: 13px; line-height: 1.7;
    padding-left: 1.3rem;
    position: relative;
    animation: emerger .4s cubic-bezier(.16,1,.3,1);
    white-space: pre-wrap;
  }
  .dicho.abel::before {
    content: "";
    position: absolute; left: 0; top: .35em;
    width: 11px; height: 11px;
    background-image: url("/favicon.svg");
    background-size: contain;
    background-repeat: no-repeat;
    opacity: .8;
  }
  .dicho.propio { color: var(--tenue); }
  .dicho.abel { color: var(--texto); }
  .dicho.silencio {
    color: var(--tenue); font-size: 11px;
    letter-spacing: .15em; opacity: .5;
  }

  #entrada-chat {
    border-top: 1px solid rgba(74, 85, 96, .25);
    padding-top: .9rem;
  }
  #mensaje {
    width: 100%; background: none; border: none;
    color: var(--texto); font: inherit; font-size: 13px;
    outline: none; padding: 0;
  }
  #mensaje::placeholder { color: rgba(74, 85, 96, .5); }
  #mensaje:disabled { opacity: .4; }

  .pensando {
    display: inline-block; width: 5px; height: 5px;
    border-radius: 50%; background: var(--frio);
    animation: latir 1.2s ease-in-out infinite;
  }
  @keyframes latir {
    0%, 100% { opacity: .2; transform: scale(.8); }
    50%      { opacity: 1;  transform: scale(1.2); }
  }
</style>
</head>
<body>

<canvas id="escena"></canvas>

<div id="entrada">
  <p>El acceso se autoriza desde el Nodo de este dispositivo</p>
  <button onclick="abrirSesion()">Entrar</button>
  <div id="error"></div>
</div>

<div id="marcas" hidden>
  <div class="marca" id="identidad"></div>
  <div class="marca" id="pulso-info">—</div>
  <div class="marca" id="hora"></div>
  <button id="invocar-chat" onclick="alternarChat()">Hablar</button>
  <div id="chat">
    <div id="conversacion"></div>
    <div id="entrada-chat">
      <input type="text" id="mensaje" placeholder="" autocomplete="off">
    </div>
  </div>

  <div id="invocador">
    <button onclick="abrirPanel('personal')">Personal</button>
    <button onclick="abrirPanel('admin')" id="boton-admin" hidden>Admin</button>
  </div>

  <div id="rastro"></div>
</div>

<div id="paneles" onclick="if(event.target===this) cerrar()">
  <div class="panel">
    <h2>
      <span id="panel-titulo"></span>
      <button onclick="cerrar()">cerrar</button>
    </h2>
    <nav id="secciones"></nav>
    <div id="panel-cuerpo"></div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "/lib/three.module.js" } }
</script>

<script type="module">
import * as THREE from "three";

/* --- La forma ------------------------------------------------------ */
/* --- Three.js ------------------------------------------------------ */

const lienzo = document.getElementById("escena");

const escena = new THREE.Scene();

const camara = new THREE.PerspectiveCamera(
  38, innerWidth / innerHeight, 0.1, 100
);
camara.position.z = 5.2;

const render = new THREE.WebGLRenderer({
  canvas: lienzo, antialias: true, alpha: true,
});
render.setPixelRatio(Math.min(devicePixelRatio, 2));
render.setSize(innerWidth, innerHeight);

addEventListener("resize", () => {
  camara.aspect = innerWidth / innerHeight;
  camara.updateProjectionMatrix();
  render.setSize(innerWidth, innerHeight);
});

const RADIO = 1.55;
const SUBDIVISION = 2;

// Qué porción del frente se aplana. Más grande, cara más ancha.
const APERTURA = Math.PI / 4.5;

function geometriaAplanada(radio, subdivision, apertura) {
  const g = new THREE.IcosahedronGeometry(radio, subdivision);
  const posicion = g.getAttribute("position");

  const planoZ = radio * Math.cos(apertura);

  // La cara: los vértices del frente se proyectan sobre un plano.
  for (let i = 0; i < posicion.count; i++) {
    const x = posicion.getX(i);
    const y = posicion.getY(i);
    const z = posicion.getZ(i);

    const angulo = Math.acos(z / Math.hypot(x, y, z));
    if (angulo >= apertura) continue;

    posicion.setZ(i, planoZ);
  }

  // Los polos también se aplanan: un icosaedro subdividido termina en
  // punta arriba y abajo, y esas puntas quedan raras al lado de una cara
  // recortada.
  const aperturaPolo = Math.PI / 9;
  const planoY = radio * Math.cos(aperturaPolo);

  for (let i = 0; i < posicion.count; i++) {
    const x = posicion.getX(i);
    const y = posicion.getY(i);
    const z = posicion.getZ(i);
    const largo = Math.hypot(x, y, z);

    const desdeArriba = Math.acos(y / largo);
    if (desdeArriba < aperturaPolo) { posicion.setY(i, planoY); continue; }

    const desdeAbajo = Math.acos(-y / largo);
    if (desdeAbajo < aperturaPolo) posicion.setY(i, -planoY);
  }

  posicion.needsUpdate = true;
  g.computeVertexNormals();
  return g;
}

const geometria = geometriaAplanada(RADIO, SUBDIVISION, APERTURA);

// Cáscara casi opaca: sin esto, las aristas traseras se cruzan con los ojos
// y la lectura se vuelve confusa. El color es apenas más claro que el fondo
// para que se lea como cáscara y no como objeto sólido.
const cascara = new THREE.Mesh(
  geometria,
  new THREE.MeshBasicMaterial({
    color: 0x1a4a52,
    transparent: true,
    opacity: 0.35,
    side: THREE.DoubleSide,
    depthWrite: false,
  })
);

// El wireframe sin las aristas de la cara: en el plano frontal se ven como
// rayones sobre lo que debería ser una superficie lisa.
function aristasSinCara(geo, planoZ) {
  const wire = new THREE.WireframeGeometry(geo);
  const pos = wire.getAttribute("position");
  const conservadas = [];
  const margen = 0.001;

  // Un vértice fue aplanado si su Z es exactamente el del plano. No hace
  // falta comparar radios: el recorte sigue los triángulos del icosaedro
  // y no es circular, así que ningún radio único calza bien.
  const aplanado = z => Math.abs(z - planoZ) < margen;

  for (let i = 0; i < pos.count; i += 2) {
    if (aplanado(pos.getZ(i)) && aplanado(pos.getZ(i + 1))) continue;

    for (let v = 0; v < 2; v++) {
      conservadas.push(pos.getX(i + v), pos.getY(i + v), pos.getZ(i + v));
    }
  }

  const limpia = new THREE.BufferGeometry();
  limpia.setAttribute(
    "position", new THREE.Float32BufferAttribute(conservadas, 3)
  );
  return limpia;
}

const aristas = new THREE.LineSegments(
  aristasSinCara(geometria, RADIO * Math.cos(APERTURA)),
  new THREE.LineBasicMaterial({
    color: 0x2b8f9e, transparent: true, opacity: 0.55,
  })
);

const nucleo = new THREE.Group();
nucleo.add(cascara);
nucleo.add(aristas);
// La zona de los ojos, un poco más clara que el resto: marca dónde mira
// sin necesidad de un borde dibujado.
// La zona de los ojos: sigue el contorno real del recorte, no un círculo.
// Se arma con los vértices que quedaron sobre el plano.
function discoDeLaCara(geo, planoZ, radioPlano) {
  const pos = geo.getAttribute("position");
  const enBorde = [];
  const vistos = new Set();

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    if (z < planoZ - 0.01) continue;

    const r = Math.hypot(x, y);
    if (r < radioPlano * 0.7) continue;   // solo el anillo exterior

    const clave = `${x.toFixed(3)},${y.toFixed(3)}`;
    if (vistos.has(clave)) continue;
    vistos.add(clave);
    enBorde.push({ x, y, a: Math.atan2(y, x) });
  }

  enBorde.sort((p, q) => p.a - q.a);

  const forma = new THREE.Shape();
  enBorde.forEach((p, i) => {
    if (i === 0) forma.moveTo(p.x, p.y);
    else forma.lineTo(p.x, p.y);
  });
  forma.closePath();

  return new THREE.ShapeGeometry(forma);
}

const zonaCara = new THREE.Mesh(
  discoDeLaCara(
    geometria,
    RADIO * Math.cos(APERTURA),
    RADIO * Math.sin(APERTURA)
  ),
  new THREE.MeshBasicMaterial({
    color: 0x2d6b74,
    transparent: true,
    opacity: 0.3,
    side: THREE.DoubleSide,
    depthWrite: false,
  })
);
zonaCara.position.z = RADIO * Math.cos(APERTURA) + 0.005;
nucleo.add(zonaCara);
escena.add(nucleo);

// Vértices como puntos: la estructura se lee incluso cuando las
// aristas se atenúan.
// Vértices como esferas reales. Los Points con textura dependen de cómo el
// navegador resuelve el sprite; una geometría instanciada es predecible.
const posVertices = geometria.getAttribute("position");
const esfera = new THREE.SphereGeometry(0.008, 8, 8);
const materialVertice = new THREE.MeshBasicMaterial({
  color: 0x9fe8f0, transparent: true, opacity: 0.65,
});

const vertices = new THREE.InstancedMesh(
  esfera, materialVertice, posVertices.count
);

const auxiliar = new THREE.Object3D();
const planoZ = RADIO * Math.cos(APERTURA);
const radioPlano = RADIO * Math.sin(APERTURA);

// Los vértices que quedaron sobre la cara no se dibujan: es una superficie
// lisa, no una malla.
const enLaCara = i => Math.abs(posVertices.getZ(i) - planoZ) < 0.001;
let colocados = 0;
for (let i = 0; i < posVertices.count; i++) {
  if (enLaCara(i)) continue;
  auxiliar.position.set(
    posVertices.getX(i), posVertices.getY(i), posVertices.getZ(i)
  );
  auxiliar.updateMatrix();
  vertices.setMatrixAt(colocados, auxiliar.matrix);
  colocados++;
}
vertices.count = colocados;
vertices.instanceMatrix.needsUpdate = true;
nucleo.add(vertices);

// Halo de los vértices: esferas mayores y tenues, sumadas por
// AdditiveBlending. Da el resplandor sin post-procesado.
const auraVertices = new THREE.InstancedMesh(
  new THREE.SphereGeometry(0.009, 8, 8),
  new THREE.MeshBasicMaterial({
    color: 0x4fd1e0, transparent: true, opacity: 0.05,
    depthWrite: false, blending: THREE.AdditiveBlending,
  }),
  posVertices.count
);

let colocadosAura = 0;
for (let i = 0; i < posVertices.count; i++) {
  if (enLaCara(i)) continue;
  auxiliar.position.set(
    posVertices.getX(i), posVertices.getY(i), posVertices.getZ(i)
  );
  auxiliar.updateMatrix();
  auraVertices.setMatrixAt(colocadosAura, auxiliar.matrix);
  colocadosAura++;
}
auraVertices.count = colocadosAura;
auraVertices.instanceMatrix.needsUpdate = true;
nucleo.add(auraVertices);
/* --- Los ojos ------------------------------------------------------ */

// Dos anillos en el hueco frontal. Se orientan con la forma pero no giran
// con ella: siempre miran hacia adelante, hacia quien esté del otro lado.
function formaOvalada(ancho, alto, radio) {
  const forma = new THREE.Shape();
  const a = ancho / 2, b = alto / 2, r = Math.min(radio, a, b);

  forma.moveTo(-a + r, -b);
  forma.lineTo(a - r, -b);
  forma.quadraticCurveTo(a, -b, a, -b + r);
  forma.lineTo(a, b - r);
  forma.quadraticCurveTo(a, b, a - r, b);
  forma.lineTo(-a + r, b);
  forma.quadraticCurveTo(-a, b, -a, b - r);
  forma.lineTo(-a, -b + r);
  forma.quadraticCurveTo(-a, -b, -a + r, -b);

  return forma;
}

function crearOjo(x) {
  const grupo = new THREE.Group();

  // Una barra horizontal, no un círculo: un anillo redondo se lee como
  // ojo de dibujo animado. Esto es más cerca de un visor.
  const barra = new THREE.Mesh(
    new THREE.ShapeGeometry(formaOvalada(0.15, 0.27, 0.065), 12),
    new THREE.MeshBasicMaterial({
      color: 0xd8f4f8, transparent: true, opacity: 1,
      side: THREE.DoubleSide, depthWrite: false,
    })
  );
  grupo.add(barra);

  const halo = new THREE.Mesh(
    new THREE.ShapeGeometry(formaOvalada(0.26, 0.4, 0.11), 12),
    new THREE.MeshBasicMaterial({
      color: 0x4fd1e0, transparent: true, opacity: 0.12,
      side: THREE.DoubleSide, depthWrite: false,
      blending: THREE.AdditiveBlending,
    })
  );
  grupo.add(halo);

  grupo.position.set(x, 0.04, RADIO * Math.cos(APERTURA) + 0.01);
  grupo.userData = { anillo: barra, halo, base: grupo.position.clone() };
  return grupo;
}

const ojoIzq = crearOjo(-0.26);
const ojoDer = crearOjo(0.26);

// Los ojos van en su propio grupo, fuera de la rotación del núcleo: la
// forma se orienta, los ojos miran. Si rotaran con ella se irían de vista.
const mirada = new THREE.Group();
mirada.add(ojoIzq);
mirada.add(ojoDer);
nucleo.add(mirada);

// Parpadeo: irregular a propósito. Un ritmo fijo se lee como máquina.
let proximoParpadeo = 2 + Math.random() * 4;
let parpadeo = 0;

// Polvo alrededor. Muy poco y muy tenue: sugiere espacio, no lo llena.
const cantidadPolvo = 400;
const posiciones = new Float32Array(cantidadPolvo * 3);
for (let i = 0; i < cantidadPolvo; i++) {
  const radio = 3 + Math.random() * 7;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  posiciones[i * 3]     = radio * Math.sin(phi) * Math.cos(theta);
  posiciones[i * 3 + 1] = radio * Math.sin(phi) * Math.sin(theta);
  posiciones[i * 3 + 2] = radio * Math.cos(phi);
}
const geometriaPolvo = new THREE.BufferGeometry();
geometriaPolvo.setAttribute("position", new THREE.BufferAttribute(posiciones, 3));
const polvo = new THREE.Points(
  geometriaPolvo,
  new THREE.PointsMaterial({
    color: 0x6b7a8a, size: 0.035, transparent: true, opacity: 0.55,
    depthWrite: false, blending: THREE.AdditiveBlending,
  })
);
escena.add(polvo);

const auraPolvo = new THREE.Points(
  geometriaPolvo,
  new THREE.PointsMaterial({
    color: 0x4fd1e0, size: 0.06, transparent: true, opacity: 0.12,
    depthWrite: false, blending: THREE.AdditiveBlending,
  })
);
escena.add(auraPolvo);

/* ==================================================================
   El comportamiento
   ------------------------------------------------------------------
   La forma no gira porque sí: reacciona. Se orienta hacia el cursor
   con retraso — atención, no seguimiento. Late con la presencia.
   Se sacude cuando llega un evento.
   ================================================================== */

const atencion = { x: 0, y: 0, objetivoX: 0, objetivoY: 0 };
const estado = {
  latido: 0,          // decae desde 1 tras cada marca de presencia
  sobresalto: 0,      // decae desde 1 tras cada evento
  quietud: 0,         // crece cuando no pasa nada
  activo: true,
};

addEventListener("pointermove", e => {
  // Rango limitado: mira, no persigue.
  atencion.objetivoX = ((e.clientY / innerHeight) - 0.5) * 0.5;
  atencion.objetivoY = ((e.clientX / innerWidth) - 0.5) * 0.9;
  estado.quietud = 0;
});

function latir() { estado.latido = 1; }
function sobresaltar() { estado.sobresalto = 1; }
let atendiendo = false;

function atender() {
  atendiendo = true;
  setTimeout(() => { atendiendo = false; }, 30000);
}

function terminar() { atendiendo = false; }

const reloj = new THREE.Clock();

function animar() {
  requestAnimationFrame(animar);
  const t = reloj.getElapsedTime();
  const dt = Math.min(reloj.getDelta(), 0.1);

  // Orientación: sigue al cursor con inercia. El 0.045 es lo que hace
  // que se sienta pesado y deliberado en vez de reactivo.
  atencion.x += (atencion.objetivoX - atencion.x) * 0.045;
  atencion.y += (atencion.objetivoY - atencion.y) * 0.045;

  estado.quietud += dt;
  estado.latido = Math.max(0, estado.latido - dt * 0.6);
  estado.sobresalto = Math.max(0, estado.sobresalto - dt * 2.2);

  // Deriva lenta cuando nadie mira. No es rotación constante: es
  // aburrimiento — aparece recién después de unos segundos quieto.
  const deriva = Math.min(estado.quietud - 4, 8) * 0.012;
  const vagar = deriva > 0 ? deriva : 0;

  nucleo.rotation.x = atencion.x + Math.sin(t * 0.11) * 0.12 * (1 + vagar);
  nucleo.rotation.y = atencion.y + t * 0.035 * (0.3 + vagar);
  nucleo.rotation.z = Math.sin(t * 0.07) * 0.05;

  // Respiración de fondo, más el latido de la presencia.
  const respirar = 1 + Math.sin(t * 0.55) * 0.012;
  const pulsar = 1 + estado.latido * estado.latido * 0.09;
  const temblar = 1 + estado.sobresalto * 0.035;
  // Mientras procesa, la forma se contrae y late más rápido: la espera se
  // ve en ABEL, no en un cartel.
  const procesando = atendiendo
    ? 0.94 + Math.sin(t * 4.5) * 0.025
    : 1;
  nucleo.scale.setScalar(respirar * pulsar * temblar * procesando);

  // La intensidad sigue al estado: apagado cuando no hay nadie,
  // encendido cuando algo ocurre.
  const base = estado.activo ? 0.5 : 0.22;
  aristas.material.opacity = base + estado.latido * 0.3 + estado.sobresalto * 0.35;
  vertices.material.opacity = 0.7 + estado.sobresalto * 0.3;

  polvo.rotation.y = t * 0.006;
  polvo.rotation.x = t * 0.003;
  auraPolvo.rotation.copy(polvo.rotation);
  auraVertices.material.opacity = 0.28 + estado.latido * 0.25 + estado.sobresalto * 0.3;

  // Parpadeo irregular.
  proximoParpadeo -= dt;
  if (proximoParpadeo <= 0) {
    parpadeo = 1;
    proximoParpadeo = 2.5 + Math.random() * 5;
  }
  parpadeo = Math.max(0, parpadeo - dt * 7);

  const abierto = 1 - parpadeo;
  for (const ojo of [ojoIzq, ojoDer]) {
    ojo.scale.y = 0.15 + abierto * 0.85;
    ojo.userData.anillo.material.opacity =
      0.8 + estado.latido * 0.2 + estado.sobresalto * 0.2;
    ojo.userData.halo.material.opacity =
      0.08 + estado.latido * 0.18 + estado.sobresalto * 0.2;
  }
  render.render(escena, camara);
}
animar();

/* ==================================================================
   Conexión con ABEL
   ================================================================== */

const $ = id => document.getElementById(id);

async function api(ruta, opciones) {
  const r = await fetch(ruta, opciones);
  return { ok: r.ok, datos: r.ok ? await r.json() : null };
}

function duracion(s) {
  if (s < 60) return Math.round(s) + "s";
  if (s < 3600) return (s / 60).toFixed(1) + "min";
  return (s / 3600).toFixed(1) + "h";
}

function horaDe(iso) {
  return new Date(iso).toLocaleTimeString("es-AR", {
    hour: "2-digit", minute: "2-digit", hour12: false,
  });
}

let abriendoSesion = false;

window.abrirSesion = async function () {
  if (abriendoSesion) return;
  abriendoSesion = true;

  const boton = document.querySelector("#entrada button");
  if (boton) { boton.disabled = true; boton.textContent = "…"; }
  $("error").textContent = "";

  try {
    const r = await fetch("/api/sesion/abrir", { method: "POST" });
    if (r.ok) return iniciar();
    const datos = await r.json().catch(() => ({}));
    $("error").textContent = datos.error || "No se pudo abrir la sesión.";
  } catch (e) {
    $("error").textContent = "Sin conexión.";
  } finally {
    abriendoSesion = false;
    if (boton) { boton.disabled = false; boton.textContent = "Entrar"; }
  }
};

/* --- Paneles ------------------------------------------------------ */

const vistas = {
  estado: {
    nombre: "Estado",
    ruta: "/api/sangre",
    dibujar: datos => {
      // Umbral chico para no marcar el ruido del decaimiento como tendencia:
      // sin esto, cualquier valor con reposo se muestra siempre "bajando".
      const UMBRAL_TENDENCIA = 0.01;

      const fila = ([nombre, v]) => {
        const tendencia =
          v.tendencia > UMBRAL_TENDENCIA ? "▲" :
          v.tendencia < -UMBRAL_TENDENCIA ? "▼" : "·";
        const claseTendencia =
          v.tendencia > UMBRAL_TENDENCIA ? "sube" :
          v.tendencia < -UMBRAL_TENDENCIA ? "baja" : "";

        return `
          <div class="valor-sangre ${v.activo ? "" : "inactivo"}" title="${v.descripcion}">
            <div class="cabecera">
              <span class="nombre">${nombre}</span>
              <span class="cifras">
                <span class="tendencia ${claseTendencia}">${tendencia}</span>
                <span>${v.nivel.toFixed(2)}</span>
              </span>
            </div>
            <div class="barra">
              <div class="relleno" style="width:${v.nivel * 100}%"></div>
              ${v.reposo > 0 ? `<div class="reposo" style="left:${v.reposo * 100}%"></div>` : ""}
            </div>
          </div>`;
      };

      const entradas = Object.entries(datos);
      const activos = entradas.filter(([, v]) => v.activo);
      const inactivos = entradas.filter(([, v]) => !v.activo);

      return activos.map(fila).join("")
        + (inactivos.length
            ? `<div class="subtitulo-sangre">sin dueño todavía</div>` + inactivos.map(fila).join("")
            : "");
    },
  },
  actividad: {
    nombre: "Actividad",
    ruta: "/api/actividad",
    dibujar: datos => datos.length
      ? datos.map(a => `
          <div class="fila">
            <span>${a.aplicacion}</span>
            <span class="dato">${duracion(a.segundos)} · ${a.sesiones}</span>
          </div>`).join("")
      : '<div class="vacio-mensaje">Nada registrado todavía.</div>',
  },
  registro: {
    nombre: "Registro",
    ruta: "/api/sesiones-ventana?limite=40",
    dibujar: datos => datos.length
      ? datos.map(s => `
          <div class="fila">
            <span class="titulo">${s.titulo || s.aplicacion}</span>
            <span class="dato">${horaDe(s.momento)} · ${duracion(s.segundos)}</span>
          </div>`).join("")
      : '<div class="vacio-mensaje">Sin registro.</div>',
  },
  presencia: {
    nombre: "Presencia",
    ruta: "/api/presencia?dias=2",
    dibujar: datos => datos.length
      ? datos.map(p => `
          <div class="fila">
            <span>${p.estado === "active" ? "activo" : "inactivo"}</span>
            <span class="dato">${horaDe(p.momento)} · ${p.dispositivo}</span>
          </div>`).join("")
      : '<div class="vacio-mensaje">Sin cambios registrados.</div>',
  },
  sistema: {
    nombre: "Sistema",
    ruta: "/api/estado",
    dibujar: datos => `
      <div class="fila">
        <span>Eventos en memoria</span>
        <span class="dato">${datos.total_eventos}</span>
      </div>
      ${datos.dispositivos.map(d => `
        <div class="fila">
          <span>${d.nombre}</span>
          <span class="dato">${d.confianza} · ${d.ultima_senal ? horaDe(d.ultima_senal) : "nunca"}</span>
        </div>`).join("")}`,
  },
  memoria: {
    nombre: "Memoria",
    ruta: "/api/estado",
    dibujar: datos => datos.eventos.map(e => `
      <div class="fila">
        <span class="titulo">${e.tipo}</span>
        <span class="dato">${e.cantidad}</span>
      </div>`).join(""),
  },
};

// Qué secciones tiene cada panel. El de admin exige rol y dispositivo
// admin; el servidor lo verifica igual, esto solo evita mostrar lo que
// no se puede usar.
const paneles = {
  personal: { titulo: "Personal", vistas: ["actividad", "registro", "presencia"] },
  admin:    { titulo: "Administración", vistas: ["estado", "sistema", "memoria"] },
};

let panelActual = null;

// Id del intervalo de refresco de la sección Estado. Vive en el módulo
// porque hay que poder cancelarlo desde cerrar() y desde verSeccion(),
// no solo desde donde se creó.
let intervaloEstado = null;

window.abrirPanel = function (clave) {
  panelActual = paneles[clave];
  $("panel-titulo").textContent = panelActual.titulo;

  $("secciones").innerHTML = panelActual.vistas.map((v, i) => `
    <button onclick="verSeccion('${v}', this)" class="${i === 0 ? 'activa' : ''}">
      ${vistas[v].nombre}
    </button>`).join("");

  $("paneles").classList.add("visible");
  verSeccion(panelActual.vistas[0], $("secciones").firstElementChild);
};

window.verSeccion = async function (clave, boton) {
  // Cambiar de sección corta cualquier refresco anterior: si no, al salir
  // de Estado el intervalo sigue pidiendo al servidor para siempre.
  if (intervaloEstado !== null) {
    clearInterval(intervaloEstado);
    intervaloEstado = null;
  }

  const vista = vistas[clave];

  document.querySelectorAll("#secciones button")
    .forEach(b => b.classList.toggle("activa", b === boton));

  $("panel-cuerpo").innerHTML = '<div class="vacio-mensaje">…</div>';

  const { ok, datos } = await api(vista.ruta);
  $("panel-cuerpo").innerHTML = ok
    ? vista.dibujar(datos)
    : '<div class="vacio-mensaje">No disponible.</div>';

  // Estado es la única sección que muestra condición en vivo: mientras
  // esté abierta tiene sentido pedir de nuevo cada pocos segundos.
  if (clave === "estado") {
    intervaloEstado = setInterval(async () => {
      const { ok, datos } = await api(vista.ruta);
      if (ok) $("panel-cuerpo").innerHTML = vista.dibujar(datos);
    }, 5000);
  }
};

window.cerrar = () => {
  $("paneles").classList.remove("visible");
  if (intervaloEstado !== null) {
    clearInterval(intervaloEstado);
    intervaloEstado = null;
  }
};

addEventListener("keydown", e => {
  if (e.key !== "Escape") return;

  if ($("paneles").classList.contains("visible")) {
    cerrar();
  } else if ($("chat").classList.contains("abierto")) {
    alternarChat();
  }
});

/* --- Canal en vivo ------------------------------------------------ */

function anotar(texto) {
  const linea = document.createElement("div");
  linea.textContent = texto;
  $("rastro").prepend(linea);
  setTimeout(() => linea.remove(), 6000);
  while ($("rastro").children.length > 5) $("rastro").lastChild.remove();
}

function conectarCanal() {
  const esquema = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${esquema}://${location.host}/api/canal`);

  ws.onopen = () => { estado.activo = true; };
  ws.onclose = () => {
    estado.activo = false;
    $("pulso-info").textContent = "sin señal";
    setTimeout(conectarCanal, 3000);
  };

  ws.onmessage = e => {
    const aviso = JSON.parse(e.data);

   if (aviso.tipo === "presence_mark") {
      latir();
      $("pulso-info").textContent = `pulso ${horaDe(aviso.momento)}`;
    } else if (aviso.tipo !== "utterance") {
      // Los turnos de conversación ya se ven en el chat.
      sobresaltar();
      anotar(aviso.tipo.replace(/_/g, " "));
    }

    if (aviso.tipo === "session_state") {
      estado.activo = aviso.resumen?.state === "active";
    }
  };
}

/* --- Arranque ----------------------------------------------------- */

function actualizarHora() {
  $("hora").textContent = new Date().toLocaleTimeString("es-AR", {
    hour: "2-digit", minute: "2-digit", hour12: false,
  });
}

/* --- Conversación ------------------------------------------------- */

function decir(texto, clase) {
  const linea = document.createElement("div");
  linea.className = `dicho ${clase}`;
  linea.textContent = texto;
  $("conversacion").append(linea);
  // requestAnimationFrame para que el scroll ocurra después de que el
  // navegador midió el elemento nuevo: hacerlo antes calcula sobre la
  // altura vieja y queda corto.
  requestAnimationFrame(() => {
    $("conversacion").scrollTop = $("conversacion").scrollHeight;
  });
  return linea;
}

window.alternarChat = function () {
  const chat = $("chat");
  const abierto = chat.classList.toggle("abierto");
  $("invocar-chat").classList.toggle("oculto", abierto);
  if (abierto) $("mensaje").focus();
  else $("mensaje").blur();
};

async function enviar(texto) {
  decir(texto, "propio");

  const campo = $("mensaje");
  campo.value = "";
  campo.disabled = true;

  // La forma se agita mientras piensa: la espera se ve en ABEL, no en
  // un cartel de "escribiendo...".
  const marca = decir("", "dicho");
  marca.innerHTML = '<span class="pensando"></span>';
  atender();

  try {
    const r = await fetch("/api/conversar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mensaje: texto }),
    });

    const datos = await r.json();
    marca.remove();

    if (!r.ok) {
      decir(
        datos.error === "lenguaje_no_disponible"
          ? "sin lenguaje disponible"
          : "algo falló",
        "silencio"
      );
      return;
    }

    if (datos.habla) {
      decir(datos.texto, "abel");
    } else {
      // ABEL registró el mensaje y no tiene nada que decir. Se marca con
      // un gesto, no con una frase de relleno.
      decir("· · ·", "silencio");
      sobresaltar();
    }
  } catch (e) {
    marca.remove();
    decir("sin conexión", "silencio");
  } finally {
    terminar();
    campo.disabled = false;
    campo.focus();
  }
}

$("mensaje").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const texto = e.target.value.trim();
  if (texto) enviar(texto);
});

async function cargarHistorial() {
  const { ok, datos } = await api("/api/historial");
  if (!ok || !datos.length) return;

  $("conversacion").innerHTML = "";
  for (const turno of datos) {
    if (turno.hablante === "abel") {
      decir(turno.callo ? "· · ·" : turno.texto,
            turno.callo ? "silencio" : "abel");
    } else {
      decir(turno.texto, "propio");
    }
  }
}

async function iniciar() {
  const { datos } = await api("/api/sesion");

  if (!datos?.autenticado) {
    $("entrada").classList.remove("oculto");
    $("marcas").hidden = true;
    lienzo.classList.remove("visible");
    return;
  }

  $("entrada").classList.add("oculto");
  $("marcas").hidden = false;
  lienzo.classList.add("visible");
  $("identidad").textContent = `${datos.usuario} · ${datos.dispositivo}`;
  $("boton-admin").hidden =
    !(datos.rol === "admin" && datos.confianza === "admin");
  requestAnimationFrame(() => {
    $("conversacion").scrollTop = $("conversacion").scrollHeight;
  });

  await cargarHistorial();
  actualizarHora();
  setInterval(actualizarHora, 20000);
  conectarCanal();
}

iniciar();
</script>
