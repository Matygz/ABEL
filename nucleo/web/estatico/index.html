<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABEL</title>
<style>
  :root {
    --vacio: #05070a;
    --tenue: #4a5560;
    --texto: #b8c4d0;
    --frio: #4fd1e0;
    --calido: #e8b04f;
    --alerta: #e05f5f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%; overflow: hidden;
    background: var(--vacio); color: var(--texto);
    font: 13px/1.7 ui-monospace, "Cascadia Code", Consolas, monospace;
    letter-spacing: .02em;
  }

  #escena { position: fixed; inset: 0; opacity: 0; transition: opacity 1.2s; }
  #escena.visible { opacity: 1; }

  /* --- Marcas mínimas en las esquinas ------------------------------ */

  .marca {
    position: fixed; font-size: 10px; letter-spacing: .2em;
    color: var(--tenue); text-transform: uppercase;
    pointer-events: none; user-select: none;
    transition: opacity .8s;
  }
  #identidad { top: 1.75rem; left: 2rem; }
  #pulso-info { bottom: 1.75rem; left: 2rem; }
  #hora { bottom: 1.75rem; right: 2rem; }

  /* --- Invocador --------------------------------------------------- */

  #invocador {
    position: fixed; top: 1.5rem; right: 2rem;
    display: flex; gap: .6rem;
    opacity: .25; transition: opacity .5s;
  }
  #invocador:hover { opacity: 1; }

  #invocador button {
    background: none; border: 1px solid var(--tenue);
    color: var(--tenue); font: inherit; font-size: 10px;
    letter-spacing: .15em; text-transform: uppercase;
    padding: .4rem .9rem; border-radius: 2px; cursor: pointer;
    transition: all .25s;
  }
  #invocador button:hover {
    border-color: var(--frio); color: var(--frio);
  }

  /* --- Paneles emergentes ------------------------------------------ */

  #paneles {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: rgba(5, 7, 10, .55);
    backdrop-filter: blur(3px);
  }
  #paneles.visible { display: flex; }

  .panel {
    width: min(38rem, 90vw); max-height: 78vh;
    background: rgba(9, 12, 17, .94);
    border: 1px solid rgba(74, 85, 96, .35);
    border-radius: 3px; padding: 1.75rem 2rem;
    overflow-y: auto;
    animation: emerger .3s cubic-bezier(.16,1,.3,1);
  }
  @keyframes emerger {
    from { opacity: 0; transform: translateY(8px) scale(.99); }
  }

  .panel h2 {
    font-size: 10px; font-weight: 400; letter-spacing: .25em;
    text-transform: uppercase; color: var(--tenue);
    margin-bottom: 1.5rem;
    display: flex; justify-content: space-between;
  }
  .panel h2 button {
    background: none; border: none; color: var(--tenue);
    font: inherit; cursor: pointer; letter-spacing: .1em;
  }
  .panel h2 button:hover { color: var(--texto); }

  .fila {
    display: flex; justify-content: space-between; gap: 1.5rem;
    padding: .5rem 0;
    border-bottom: 1px solid rgba(74, 85, 96, .12);
  }
  .fila:last-child { border-bottom: none; }
  .fila .dato { color: var(--tenue); white-space: nowrap; font-size: 12px; }
  .fila .titulo {
    color: var(--tenue); font-size: 11px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .vacio-mensaje {
    color: var(--tenue); font-size: 12px; padding: 1rem 0;
  }

  #invocar-chat {
    position: fixed; bottom: 1.75rem; left: 50%;
    transform: translateX(-50%);
    background: none; border: 1px solid var(--tenue);
    color: var(--tenue); font: inherit; font-size: 10px;
    letter-spacing: .2em; text-transform: uppercase;
    padding: .5rem 1.4rem; border-radius: 2px; cursor: pointer;
    opacity: .3; transition: all .35s;
  }
  #invocar-chat:hover { opacity: 1; border-color: var(--frio); color: var(--frio); }
  #invocar-chat.oculto { opacity: 0; pointer-events: none; }
  /* --- Rastro de eventos ------------------------------------------- */

  #rastro {
    position: fixed; top: 50%; right: 2rem;
    transform: translateY(-50%);
    text-align: right; pointer-events: none;
    font-size: 10px; letter-spacing: .1em;
  }
  #rastro div {
    color: var(--tenue); opacity: 0;
    animation: aparecer 6s forwards;
  }
  @keyframes aparecer {
    10% { opacity: .8; }
    70% { opacity: .25; }
    100% { opacity: 0; }
  }

  /* --- Entrada ------------------------------------------------------ */

  #entrada {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2rem;
  }
  #entrada.oculto { display: none; }
  #entrada p {
    color: var(--tenue); font-size: 11px; letter-spacing: .15em;
    text-align: center; max-width: 24rem; line-height: 2;
  }
  #entrada button {
    background: none; border: 1px solid var(--frio); color: var(--frio);
    font: inherit; font-size: 11px; letter-spacing: .25em;
    text-transform: uppercase; padding: .7rem 2.5rem;
    border-radius: 2px; cursor: pointer; transition: all .3s;
  }
  #entrada button:hover {
    background: rgba(79, 209, 224, .08);
  }
  #error { color: var(--alerta); font-size: 11px; min-height: 1.5em; }
  #secciones {
    display: flex; gap: 1.5rem; margin-bottom: 1.5rem;
    padding-bottom: .75rem;
    border-bottom: 1px solid rgba(74, 85, 96, .2);
  }
  #secciones button {
    background: none; border: none; color: var(--tenue);
    font: inherit; font-size: 10px; letter-spacing: .15em;
    text-transform: uppercase; cursor: pointer; padding: 0;
    transition: color .2s;
  }
  #secciones button:hover { color: var(--texto); }
  #secciones button.activa { color: var(--frio); }

  /* --- Conversación ------------------------------------------------ */

  #chat {
    position: fixed; bottom: 0; left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: min(42rem, 92vw);
    margin-bottom: 1.5rem;
    padding: 1.25rem 1.5rem;
    background: rgba(9, 12, 17, .92);
    border: 1px solid rgba(74, 85, 96, .3);
    border-radius: 4px;
    backdrop-filter: blur(6px);
    display: flex; flex-direction: column; gap: .9rem;
    opacity: 0; pointer-events: none;
    transition: transform .45s cubic-bezier(.16,1,.3,1), opacity .35s;
  }
  #chat.abierto {
    transform: translateX(-50%) translateY(0);
    opacity: 1; pointer-events: auto;
  }

  #conversacion {
    display: flex; flex-direction: column; gap: .6rem;
    max-height: 40vh; overflow-y: auto;
    scrollbar-width: none;
    padding-top: 3rem;
    /* Los mensajes se desvanecen hacia arriba. Vuelven al hacer scroll:
       la máscara es fija respecto del contenedor, no del contenido. */
    mask-image: linear-gradient(
      to bottom,
      transparent 0,
      rgba(0, 0, 0, .15) 2rem,
      rgba(0, 0, 0, .6) 3.5rem,
      #000 5rem
    );
    -webkit-mask-image: linear-gradient(
      to bottom,
      transparent 0,
      rgba(0, 0, 0, .15) 2rem,
      rgba(0, 0, 0, .6) 3.5rem,
      #000 5rem
    );
  }
  #conversacion::-webkit-scrollbar { display: none; }

 .dicho {
    font-size: 13px; line-height: 1.7;
    padding-left: 1.3rem;
    position: relative;
    animation: emerger .4s cubic-bezier(.16,1,.3,1);
  }
  .dicho.abel::before {
    content: "";
    position: absolute; left: 0; top: .35em;
    width: 11px; height: 11px;
    background-image: url("/favicon.svg");
    background-size: contain;
    background-repeat: no-repeat;
    opacity: .8;
  }
  .dicho.propio { color: var(--tenue); }
  .dicho.abel { color: var(--texto); }
  .dicho.silencio {
    color: var(--tenue); font-size: 11px;
    letter-spacing: .15em; opacity: .5;
  }

  #entrada-chat {
    border-top: 1px solid rgba(74, 85, 96, .25);
    padding-top: .9rem;
  }
  #mensaje {
    width: 100%; background: none; border: none;
    color: var(--texto); font: inherit; font-size: 13px;
    outline: none; padding: 0;
  }
  #mensaje::placeholder { color: rgba(74, 85, 96, .5); }
  #mensaje:disabled { opacity: .4; }

  .pensando {
    display: inline-block; width: 5px; height: 5px;
    border-radius: 50%; background: var(--frio);
    animation: latir 1.2s ease-in-out infinite;
  }
  @keyframes latir {
    0%, 100% { opacity: .2; transform: scale(.8); }
    50%      { opacity: 1;  transform: scale(1.2); }
  }
</style>
</head>
<body>

<canvas id="escena"></canvas>

<div id="entrada">
  <p>El acceso se autoriza desde el Nodo de este dispositivo</p>
  <button onclick="abrirSesion()">Entrar</button>
  <div id="error"></div>
</div>

<div id="marcas" hidden>
  <div class="marca" id="identidad"></div>
  <div class="marca" id="pulso-info">—</div>
  <div class="marca" id="hora"></div>
  <button id="invocar-chat" onclick="alternarChat()">Hablar</button>
  <div id="chat">
    <div id="conversacion"></div>
    <div id="entrada-chat">
      <input type="text" id="mensaje" placeholder="" autocomplete="off">
    </div>
  </div>

  <div id="invocador">
    <button onclick="abrirPanel('personal')">Personal</button>
    <button onclick="abrirPanel('admin')" id="boton-admin" hidden>Admin</button>
  </div>

  <div id="rastro"></div>
</div>

<div id="paneles" onclick="if(event.target===this) cerrar()">
  <div class="panel">
    <h2>
      <span id="panel-titulo"></span>
      <button onclick="cerrar()">cerrar</button>
    </h2>
    <nav id="secciones"></nav>
    <div id="panel-cuerpo"></div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "/lib/three.module.js" } }
</script>

<script type="module">
import * as THREE from "three";

/* ==================================================================
   La forma
   ================================================================== */

const lienzo = document.getElementById("escena");
const escena = new THREE.Scene();
escena.fog = new THREE.FogExp2(0x05070a, 0.11);

const camara = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camara.position.z = 7.2;

const render = new THREE.WebGLRenderer({
  canvas: lienzo, antialias: true, alpha: true,
});
render.setPixelRatio(Math.min(devicePixelRatio, 2));
render.setSize(innerWidth, innerHeight);

// El núcleo: icosaedro geodésico. Subdivisión 2 en vez de 3 — con 3 la
// malla se vuelve tan densa que se lee como esfera y pierde la geometría.
const nucleo = new THREE.Group();
escena.add(nucleo);

const geometria = new THREE.IcosahedronGeometry(1.55, 2);

const aristas = new THREE.LineSegments(
  new THREE.EdgesGeometry(geometria, 1),
  new THREE.LineBasicMaterial({
    color: 0x4fd1e0, transparent: true, opacity: 0.5,
  })
);
nucleo.add(aristas);

// Una segunda capa apenas mayor, más tenue: da profundidad sin bloom.
const halo = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(1.62, 2), 1),
  new THREE.LineBasicMaterial({
    color: 0x4fd1e0, transparent: true, opacity: 0.09,
  })
);
nucleo.add(halo);

// Textura circular para los puntos: PointsMaterial dibuja cuadrados por
// defecto, y a este tamaño se nota.
function texturaPunto() {
  const lienzo = document.createElement("canvas");
  lienzo.width = lienzo.height = 64;
  const ctx = lienzo.getContext("2d");
  const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0,   "rgba(255,255,255,1)");
  grad.addColorStop(0.4, "rgba(255,255,255,.6)");
  grad.addColorStop(1,   "rgba(255,255,255,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(lienzo);
}

const PUNTO = texturaPunto();
// Vértices como puntos: la estructura se lee incluso cuando las
// aristas se atenúan.
const vertices = new THREE.Points(
  new THREE.IcosahedronGeometry(1.55, 2),
  new THREE.PointsMaterial({
    color: 0x9fe8f0, size: 0.08, transparent: true, opacity: 0.8,
    map: PUNTO, depthWrite: false, blending: THREE.AdditiveBlending,
  })
);
nucleo.add(vertices);

// Polvo alrededor. Muy poco y muy tenue: sugiere espacio, no lo llena.
const cantidadPolvo = 400;
const posiciones = new Float32Array(cantidadPolvo * 3);
for (let i = 0; i < cantidadPolvo; i++) {
  const radio = 3 + Math.random() * 7;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  posiciones[i * 3]     = radio * Math.sin(phi) * Math.cos(theta);
  posiciones[i * 3 + 1] = radio * Math.sin(phi) * Math.sin(theta);
  posiciones[i * 3 + 2] = radio * Math.cos(phi);
}
const geometriaPolvo = new THREE.BufferGeometry();
geometriaPolvo.setAttribute("position", new THREE.BufferAttribute(posiciones, 3));
const polvo = new THREE.Points(
  geometriaPolvo,
  new THREE.PointsMaterial({
    color: 0x6b7a8a, size: 0.06, transparent: true, opacity: 0.6,
    map: PUNTO, depthWrite: false, blending: THREE.AdditiveBlending,
  })
);
escena.add(polvo);

/* ==================================================================
   El comportamiento
   ------------------------------------------------------------------
   La forma no gira porque sí: reacciona. Se orienta hacia el cursor
   con retraso — atención, no seguimiento. Late con la presencia.
   Se sacude cuando llega un evento.
   ================================================================== */

const atencion = { x: 0, y: 0, objetivoX: 0, objetivoY: 0 };
const estado = {
  latido: 0,          // decae desde 1 tras cada marca de presencia
  sobresalto: 0,      // decae desde 1 tras cada evento
  quietud: 0,         // crece cuando no pasa nada
  activo: true,
};

addEventListener("pointermove", e => {
  // Rango limitado: mira, no persigue.
  atencion.objetivoX = ((e.clientY / innerHeight) - 0.5) * 0.5;
  atencion.objetivoY = ((e.clientX / innerWidth) - 0.5) * 0.9;
  estado.quietud = 0;
});

addEventListener("resize", () => {
  camara.aspect = innerWidth / innerHeight;
  camara.updateProjectionMatrix();
  render.setSize(innerWidth, innerHeight);
});

function latir() { estado.latido = 1; }
function sobresaltar() { estado.sobresalto = 1; }
let atendiendo = false;

function atender() {
  atendiendo = true;
  setTimeout(() => { atendiendo = false; }, 30000);
}

function terminar() { atendiendo = false; }

const reloj = new THREE.Clock();

function animar() {
  requestAnimationFrame(animar);
  const t = reloj.getElapsedTime();
  const dt = Math.min(reloj.getDelta(), 0.1);

  // Orientación: sigue al cursor con inercia. El 0.045 es lo que hace
  // que se sienta pesado y deliberado en vez de reactivo.
  atencion.x += (atencion.objetivoX - atencion.x) * 0.045;
  atencion.y += (atencion.objetivoY - atencion.y) * 0.045;

  estado.quietud += dt;
  estado.latido = Math.max(0, estado.latido - dt * 0.6);
  estado.sobresalto = Math.max(0, estado.sobresalto - dt * 2.2);

  // Deriva lenta cuando nadie mira. No es rotación constante: es
  // aburrimiento — aparece recién después de unos segundos quieto.
  const deriva = Math.min(estado.quietud - 4, 8) * 0.012;
  const vagar = deriva > 0 ? deriva : 0;

  nucleo.rotation.x = atencion.x + Math.sin(t * 0.11) * 0.12 * (1 + vagar);
  nucleo.rotation.y = atencion.y + t * 0.035 * (0.3 + vagar);
  nucleo.rotation.z = Math.sin(t * 0.07) * 0.05;

  // Respiración de fondo, más el latido de la presencia.
  const respirar = 1 + Math.sin(t * 0.55) * 0.012;
  const pulsar = 1 + estado.latido * estado.latido * 0.09;
  const temblar = 1 + estado.sobresalto * 0.035;
  // Mientras procesa, la forma se contrae y late más rápido: la espera se
  // ve en ABEL, no en un cartel.
  const procesando = atendiendo
    ? 0.94 + Math.sin(t * 4.5) * 0.025
    : 1;
  nucleo.scale.setScalar(respirar * pulsar * temblar * procesando);

  // La intensidad sigue al estado: apagado cuando no hay nadie,
  // encendido cuando algo ocurre.
  const base = estado.activo ? 0.5 : 0.22;
  aristas.material.opacity = base + estado.latido * 0.3 + estado.sobresalto * 0.35;
  vertices.material.opacity = 0.7 + estado.sobresalto * 0.3;
  halo.material.opacity = 0.09 + estado.latido * 0.12;

  polvo.rotation.y = t * 0.006;
  polvo.rotation.x = t * 0.003;

  render.render(escena, camara);
}
animar();

/* ==================================================================
   Conexión con ABEL
   ================================================================== */

const $ = id => document.getElementById(id);

async function api(ruta, opciones) {
  const r = await fetch(ruta, opciones);
  return { ok: r.ok, datos: r.ok ? await r.json() : null };
}

function duracion(s) {
  if (s < 60) return Math.round(s) + "s";
  if (s < 3600) return (s / 60).toFixed(1) + "min";
  return (s / 3600).toFixed(1) + "h";
}

function horaDe(iso) {
  return new Date(iso).toLocaleTimeString("es-AR", {
    hour: "2-digit", minute: "2-digit", hour12: false,
  });
}

window.abrirSesion = async function () {
  $("error").textContent = "";
  const r = await fetch("/api/sesion/abrir", { method: "POST" });
  if (r.ok) return iniciar();
  const datos = await r.json().catch(() => ({}));
  $("error").textContent = datos.error || "No se pudo abrir la sesión.";
};

/* --- Paneles ------------------------------------------------------ */

const vistas = {
  actividad: {
    nombre: "Actividad",
    ruta: "/api/actividad",
    dibujar: datos => datos.length
      ? datos.map(a => `
          <div class="fila">
            <span>${a.aplicacion}</span>
            <span class="dato">${duracion(a.segundos)} · ${a.sesiones}</span>
          </div>`).join("")
      : '<div class="vacio-mensaje">Nada registrado todavía.</div>',
  },
  registro: {
    nombre: "Registro",
    ruta: "/api/sesiones-ventana?limite=40",
    dibujar: datos => datos.length
      ? datos.map(s => `
          <div class="fila">
            <span class="titulo">${s.titulo || s.aplicacion}</span>
            <span class="dato">${horaDe(s.momento)} · ${duracion(s.segundos)}</span>
          </div>`).join("")
      : '<div class="vacio-mensaje">Sin registro.</div>',
  },
  presencia: {
    nombre: "Presencia",
    ruta: "/api/presencia?dias=2",
    dibujar: datos => datos.length
      ? datos.map(p => `
          <div class="fila">
            <span>${p.estado === "active" ? "activo" : "inactivo"}</span>
            <span class="dato">${horaDe(p.momento)} · ${p.dispositivo}</span>
          </div>`).join("")
      : '<div class="vacio-mensaje">Sin cambios registrados.</div>',
  },
  sistema: {
    nombre: "Sistema",
    ruta: "/api/estado",
    dibujar: datos => `
      <div class="fila">
        <span>Eventos en memoria</span>
        <span class="dato">${datos.total_eventos}</span>
      </div>
      ${datos.dispositivos.map(d => `
        <div class="fila">
          <span>${d.nombre}</span>
          <span class="dato">${d.confianza} · ${d.ultima_senal ? horaDe(d.ultima_senal) : "nunca"}</span>
        </div>`).join("")}`,
  },
  memoria: {
    nombre: "Memoria",
    ruta: "/api/estado",
    dibujar: datos => datos.eventos.map(e => `
      <div class="fila">
        <span class="titulo">${e.tipo}</span>
        <span class="dato">${e.cantidad}</span>
      </div>`).join(""),
  },
};

// Qué secciones tiene cada panel. El de admin exige rol y dispositivo
// admin; el servidor lo verifica igual, esto solo evita mostrar lo que
// no se puede usar.
const paneles = {
  personal: { titulo: "Personal", vistas: ["actividad", "registro", "presencia"] },
  admin:    { titulo: "Administración", vistas: ["sistema", "memoria"] },
};

let panelActual = null;

window.abrirPanel = function (clave) {
  panelActual = paneles[clave];
  $("panel-titulo").textContent = panelActual.titulo;

  $("secciones").innerHTML = panelActual.vistas.map((v, i) => `
    <button onclick="verSeccion('${v}', this)" class="${i === 0 ? 'activa' : ''}">
      ${vistas[v].nombre}
    </button>`).join("");

  $("paneles").classList.add("visible");
  verSeccion(panelActual.vistas[0], $("secciones").firstElementChild);
};

window.verSeccion = async function (clave, boton) {
  const vista = vistas[clave];

  document.querySelectorAll("#secciones button")
    .forEach(b => b.classList.toggle("activa", b === boton));

  $("panel-cuerpo").innerHTML = '<div class="vacio-mensaje">…</div>';

  const { ok, datos } = await api(vista.ruta);
  $("panel-cuerpo").innerHTML = ok
    ? vista.dibujar(datos)
    : '<div class="vacio-mensaje">No disponible.</div>';
};

window.cerrar = () => $("paneles").classList.remove("visible");

addEventListener("keydown", e => {
  if (e.key !== "Escape") return;

  if ($("paneles").classList.contains("visible")) {
    cerrar();
  } else if ($("chat").classList.contains("abierto")) {
    alternarChat();
  }
});

/* --- Canal en vivo ------------------------------------------------ */

function anotar(texto) {
  const linea = document.createElement("div");
  linea.textContent = texto;
  $("rastro").prepend(linea);
  setTimeout(() => linea.remove(), 6000);
  while ($("rastro").children.length > 5) $("rastro").lastChild.remove();
}

function conectarCanal() {
  const esquema = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${esquema}://${location.host}/api/canal`);

  ws.onopen = () => { estado.activo = true; };
  ws.onclose = () => {
    estado.activo = false;
    $("pulso-info").textContent = "sin señal";
    setTimeout(conectarCanal, 3000);
  };

  ws.onmessage = e => {
    const aviso = JSON.parse(e.data);

   if (aviso.tipo === "presence_mark") {
      latir();
      $("pulso-info").textContent = `pulso ${horaDe(aviso.momento)}`;
    } else if (aviso.tipo !== "utterance") {
      // Los turnos de conversación ya se ven en el chat.
      sobresaltar();
      anotar(aviso.tipo.replace(/_/g, " "));
    }

    if (aviso.tipo === "session_state") {
      estado.activo = aviso.resumen?.state === "active";
    }
  };
}

/* --- Arranque ----------------------------------------------------- */

function actualizarHora() {
  $("hora").textContent = new Date().toLocaleTimeString("es-AR", {
    hour: "2-digit", minute: "2-digit", hour12: false,
  });
}

/* --- Conversación ------------------------------------------------- */

function decir(texto, clase) {
  const linea = document.createElement("div");
  linea.className = `dicho ${clase}`;
  linea.textContent = texto;
  $("conversacion").append(linea);
  $("conversacion").scrollTop = $("conversacion").scrollHeight;
  return linea;
}

window.alternarChat = function () {
  const chat = $("chat");
  const abierto = chat.classList.toggle("abierto");
  $("invocar-chat").classList.toggle("oculto", abierto);
  if (abierto) $("mensaje").focus();
  else $("mensaje").blur();
};

async function enviar(texto) {
  decir(texto, "propio");

  const campo = $("mensaje");
  campo.value = "";
  campo.disabled = true;

  // La forma se agita mientras piensa: la espera se ve en ABEL, no en
  // un cartel de "escribiendo...".
  const marca = decir("", "dicho");
  marca.innerHTML = '<span class="pensando"></span>';
  atender();

  try {
    const r = await fetch("/api/conversar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mensaje: texto }),
    });

    const datos = await r.json();
    marca.remove();

    if (!r.ok) {
      decir(
        datos.error === "lenguaje_no_disponible"
          ? "sin lenguaje disponible"
          : "algo falló",
        "silencio"
      );
      return;
    }

    if (datos.habla) {
      decir(datos.texto, "abel");
    } else {
      // ABEL registró el mensaje y no tiene nada que decir. Se marca con
      // un gesto, no con una frase de relleno.
      decir("· · ·", "silencio");
      sobresaltar();
    }
  } catch (e) {
    marca.remove();
    decir("sin conexión", "silencio");
  } finally {
    terminar();
    campo.disabled = false;
    campo.focus();
  }
}

$("mensaje").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const texto = e.target.value.trim();
  if (texto) enviar(texto);
});

async function iniciar() {
  const { datos } = await api("/api/sesion");

  if (!datos?.autenticado) {
    $("entrada").classList.remove("oculto");
    $("marcas").hidden = true;
    lienzo.classList.remove("visible");
    return;
  }

  $("entrada").classList.add("oculto");
  $("marcas").hidden = false;
  lienzo.classList.add("visible");
  $("identidad").textContent = `${datos.usuario} · ${datos.dispositivo}`;
  $("identidad").textContent = `${datos.usuario} · ${datos.dispositivo}`;
  $("boton-admin").hidden =
    !(datos.rol === "admin" && datos.confianza === "admin");
  actualizarHora();
  setInterval(actualizarHora, 20000);
  conectarCanal();
}

iniciar();
</script>
